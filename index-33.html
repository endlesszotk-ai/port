<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio — Social Media & Event</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0c0c0c;color:#f0ebe2;font-family:'DM Sans',sans-serif;font-weight:300}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#b8922a}

/* NAV */
nav{
  position:sticky;top:0;z-index:99;
  background:rgba(12,12,12,.9);backdrop-filter:blur(14px);
  border-bottom:1px solid #222;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 40px;height:56px;
}
@media(max-width:600px){nav{padding:0 20px}}
.logo{font-family:'Playfair Display',serif;font-size:1rem;letter-spacing:.04em}
.logo span{color:#b8922a;font-style:italic}
.nav-tabs{display:flex;gap:28px}
.nav-tabs a{
  font-family:'DM Mono',monospace;font-size:.6rem;
  letter-spacing:.18em;text-transform:uppercase;
  color:#666;text-decoration:none;transition:color .2s;
}
.nav-tabs a:hover,.nav-tabs a.active{color:#b8922a}

/* HERO */
.hero{
  padding:80px 40px 60px;
  border-bottom:1px solid #1a1a1a;
}
@media(max-width:600px){.hero{padding:60px 20px 40px}}
.hero-eyebrow{
  font-family:'DM Mono',monospace;font-size:.58rem;
  letter-spacing:.28em;text-transform:uppercase;color:#b8922a;
  display:flex;align-items:center;gap:12px;margin-bottom:20px;
}
.hero-eyebrow::before{content:'';width:30px;height:1px;background:#b8922a}
h1{
  font-family:'Playfair Display',serif;font-weight:400;
  font-size:clamp(2.2rem,5vw,3.8rem);line-height:1.1;
  margin-bottom:12px;
}
h1 em{font-style:italic;color:#b8922a}
.hero-sub{font-size:.9rem;color:#666;letter-spacing:.04em}

/* SECTION */
.section{padding:72px 40px}
@media(max-width:600px){.section{padding:52px 20px}}
.sec-label{
  font-family:'DM Mono',monospace;font-size:.56rem;
  letter-spacing:.26em;text-transform:uppercase;color:#b8922a;
  display:flex;align-items:center;gap:12px;margin-bottom:12px;
}
.sec-label::after{content:'';width:40px;height:1px;background:#b8922a;opacity:.5}
h2{
  font-family:'Playfair Display',serif;font-weight:400;
  font-size:clamp(1.6rem,3vw,2.4rem);margin-bottom:8px;
}
.sec-desc{font-size:.85rem;color:#666;margin-bottom:44px;line-height:1.8}
.divider{width:1px;height:40px;background:#b8922a;opacity:.4;margin:16px 0 48px}

/* EVENTS GRID */
.events-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:16px;
}
@media(max-width:700px){.events-grid{grid-template-columns:1fr}}

/* BRANDS GRID */
.brands-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}
@media(max-width:900px){.brands-grid{grid-template-columns:1fr}}

/* CARD */
.card{
  background:#141414;border:1px solid #222;border-radius:10px;
  overflow:hidden;
  transition:border-color .3s,transform .25s;
  display:flex;flex-direction:column;
}
.card:hover{border-color:rgba(184,146,42,.45);transform:translateY(-3px)}

.card-head{
  display:flex;align-items:center;gap:10px;
  padding:12px 14px;border-bottom:1px solid #1e1e1e;
}
.ig-dot{
  width:30px;height:30px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);
  display:flex;align-items:center;justify-content:center;
  font-size:.65rem;font-weight:600;color:#fff;font-family:'DM Mono',monospace;
}
.card-meta{flex:1}
.card-label{font-size:.78rem;color:#e0dbd0;font-family:'DM Mono',monospace}
.card-sublabel{font-size:.62rem;color:#555}
.ig-icon{margin-left:auto;opacity:.35}

/* EMBED WRAPPER */
.embed-wrap{
  position:relative;background:#0e0e0e;
  min-height:380px;flex:1;overflow:hidden;
}
.embed-wrap iframe{
  width:100%;min-height:500px;border:none;display:block;
  opacity:0;transition:opacity .4s;
}
.loader{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;color:#444;
  font-family:'DM Mono',monospace;font-size:.56rem;letter-spacing:.14em;
  pointer-events:none;
}
.spinner{
  width:22px;height:22px;border-radius:50%;
  border:2px solid #222;border-top-color:#b8922a;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* CARD FOOT */
.card-foot{
  padding:10px 14px;border-top:1px solid #1e1e1e;
  display:flex;align-items:center;justify-content:space-between;
}
.badge{
  font-family:'DM Mono',monospace;font-size:.52rem;
  letter-spacing:.14em;text-transform:uppercase;
  padding:3px 9px;background:rgba(184,146,42,.1);
  color:#b8922a;border:1px solid rgba(184,146,42,.22);border-radius:4px;
}
.open-link{
  font-family:'DM Mono',monospace;font-size:.56rem;letter-spacing:.1em;
  text-transform:uppercase;color:#444;text-decoration:none;
  display:flex;align-items:center;gap:5px;transition:color .2s;
}
.open-link:hover{color:#b8922a}
.open-link svg{width:11px;height:11px}

/* BRAND CARD TOP */
.brand-top{padding:20px 18px 14px;border-bottom:1px solid #1e1e1e}
.brand-handle{
  font-family:'Playfair Display',serif;font-size:1.05rem;font-style:italic;
  color:#f0ebe2;margin-bottom:4px;
}
.brand-tag{
  font-family:'DM Mono',monospace;font-size:.52rem;
  letter-spacing:.18em;text-transform:uppercase;color:#b8922a;
}
.brand-embed-wrap{position:relative;min-height:320px;background:#0e0e0e;overflow:hidden}
.brand-embed-wrap iframe{width:100%;min-height:480px;border:none;display:block;opacity:0;transition:opacity .4s}
.brand-foot{
  padding:10px 18px;border-top:1px solid #1e1e1e;
  display:flex;justify-content:flex-end;
}

/* BG ACCENT */
.bg-alt{background:#101010}
</style>
</head>
<body>

<nav>
  <div class="logo">Portfolio<span>.</span></div>
  <div class="nav-tabs">
    <a href="#events" id="tab-ev">อีเวนท์</a>
    <a href="#brands" id="tab-br">แบรนด์</a>
  </div>
</nav>

<!-- HERO -->
<div class="hero">
  <div class="hero-eyebrow">Social Media & Event</div>
  <h1>ผลงาน<em>ตัวอย่าง</em></h1>
  <p class="hero-sub">Event Content &nbsp;·&nbsp; Online Brand Management</p>
</div>

<!-- EVENTS -->
<section class="section" id="events">
  <div class="sec-label">งานอีเวนท์</div>
  <h2>Event Work</h2>
  <div class="divider"></div>
  <p class="sec-desc">Reels & Posts จากงานอีเวนท์ — กดเล่นวิดีโอได้เลย</p>
  <div class="events-grid" id="ev-grid"></div>
</section>

<!-- BRANDS -->
<section class="section bg-alt" id="brands">
  <div class="sec-label">แบรนด์ที่ดูแล</div>
  <h2>Brand Accounts</h2>
  <div class="divider"></div>
  <p class="sec-desc">Instagram Account ที่ดูแลออนไลน์</p>
  <div class="brands-grid" id="br-grid"></div>
</section>

<script>
const events=[
  {url:'https://www.instagram.com/reel/DOf5AZ1gRiB/?igsh=MXBnMjVueXg0ZG1sMQ==', type:'Reel'},
  {url:'https://www.instagram.com/reel/DKYsKuxOGjB/?igsh=MXQwOTgydDFqOHMxbQ==', type:'Reel'},
  {url:'https://www.instagram.com/reel/DKRwNWLPrZr/?igsh=ZDdnbGVjdXowNW52',      type:'Reel'},
  {url:'https://www.instagram.com/p/DKWS2eMutY4/?igsh=bWl4eXhiczdib3V5',         type:'Post'},
  {url:'https://www.instagram.com/reel/DKWoFXuRKIY/?igsh=NDBncDlydzZ5bDRj',     type:'Reel'},
  {url:'https://www.instagram.com/reel/DKYsKuxOGjB/?igsh=MXQwOTgydDFqOHMxbQ==', type:'Reel'},
  {url:'https://www.instagram.com/p/DKZamehP53H/?igsh=d2dlOGV1MThwM3p1',         type:'Post'},
];
const brands=[
  {handle:'mes.wear',         tag:'Fashion'},
  {handle:'gordinaryshop',    tag:'Lifestyle'},
  {handle:'freakydaddyshop',  tag:'Street'},
];

function shortcode(url){
  const m=url.match(/\/(reel|p)\/([A-Za-z0-9_-]+)/);
  return m?m[2]:null;
}
function embedSrc(url){
  const sc=shortcode(url);
  if(!sc)return'';
  return url.includes('/reel/')
    ?`https://www.instagram.com/reel/${sc}/embed/captioned/`
    :`https://www.instagram.com/p/${sc}/embed/captioned/`;
}
function onLoad(fid,lid){
  const f=document.getElementById(fid),l=document.getElementById(lid);
  if(f)f.style.opacity='1';
  if(l)l.style.display='none';
}

/* IG svg icon */
const igSvg=`<svg class="ig-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#b8922a" stroke-width="1.4"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="#b8922a" stroke="none"/></svg>`;
const extSvg=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>`;

/* BUILD EVENTS */
const evGrid=document.getElementById('ev-grid');
events.forEach((item,i)=>{
  const src=embedSrc(item.url);
  const fid='ef'+i, lid='el'+i;
  const num=String(i+1).padStart(2,'0');
  evGrid.innerHTML+=`
  <div class="card">
    <div class="card-head">
      <div class="ig-dot">${num}</div>
      <div class="card-meta">
        <div class="card-label">Event Work</div>
        <div class="card-sublabel">Instagram ${item.type}</div>
      </div>
      ${igSvg}
    </div>
    <div class="embed-wrap">
      <div class="loader" id="${lid}"><div class="spinner"></div>loading...</div>
      <iframe id="${fid}" src="${src}"
        allowtransparency="true"
        allow="autoplay;clipboard-write;encrypted-media;picture-in-picture;web-share"
        scrolling="no" loading="lazy"
        onload="onLoad('${fid}','${lid}')"></iframe>
    </div>
    <div class="card-foot">
      <span class="badge">${item.type}</span>
      <a class="open-link" href="${item.url}" target="_blank" rel="noopener">Instagram ${extSvg}</a>
    </div>
  </div>`;
});

/* BUILD BRANDS */
const brGrid=document.getElementById('br-grid');
brands.forEach((item,i)=>{
  const src=`https://www.instagram.com/${item.handle}/embed/`;
  const fid='bf'+i, lid='bl'+i;
  brGrid.innerHTML+=`
  <div class="card">
    <div class="brand-top">
      <div class="brand-handle">@${item.handle}</div>
      <div class="brand-tag">${item.tag}</div>
    </div>
    <div class="brand-embed-wrap">
      <div class="loader" id="${lid}"><div class="spinner"></div>loading...</div>
      <iframe id="${fid}" src="${src}"
        allowtransparency="true"
        allow="autoplay;clipboard-write;encrypted-media;picture-in-picture;web-share"
        scrolling="no" loading="lazy"
        onload="onLoad('${fid}','${lid}')"></iframe>
    </div>
    <div class="brand-foot">
      <a class="open-link" href="https://www.instagram.com/${item.handle}/" target="_blank" rel="noopener">เปิดโปรไฟล์ ${extSvg}</a>
    </div>
  </div>`;
});

/* ACTIVE NAV */
const tabs={events:document.getElementById('tab-ev'),brands:document.getElementById('tab-br')};
const io=new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      Object.values(tabs).forEach(t=>t.classList.remove('active'));
      if(tabs[e.target.id])tabs[e.target.id].classList.add('active');
    }
  });
},{threshold:.3});
['events','brands'].forEach(id=>{const s=document.getElementById(id);if(s)io.observe(s);});
</script>
</body>
</html>
